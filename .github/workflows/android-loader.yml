name: Android local AI loader

on:
  push:
    branches: [zenia-local-ai-bridge]
    paths:
      - "android-loader/**"
      - ".github/workflows/android-loader.yml"
  pull_request:
    paths:
      - "android-loader/**"
      - ".github/workflows/android-loader.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-loader --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zenia-local-ai-debug-apk
          path: android-loader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
